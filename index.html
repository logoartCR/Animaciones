<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Faviconlogoart.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Animaciones LogoArtCR</title>
  <meta name="description" content="Ver Animaciones">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Animaciones LogoArtCR">
  <meta property="og:description" content="Ver Animaciones">
  <meta property="og:url" content="https://logoartcr.github.io/Animaciones/">
  <meta property="og:image" content="https://logoartcr.github.io/Animaciones/Faviconlogoart.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f4f4;
    }

    #mi-catalogo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="mi-catalogo" src=""></iframe>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4pDgWOfCkaBO8IPBiSzz0QMUZ1UO184LhzCLIaOVP5NSga6GRLaRH4Dj4gcVLC6Or/exec";

    var urlParams = new URLSearchParams(window.location.search);
    var idAnimacion = String(urlParams.get('id') || '').trim();
    var idCategoria = String(urlParams.get('cat') || '').trim();

    var iframe = document.getElementById('mi-catalogo');

    iframe.name = JSON.stringify({
      id: idAnimacion,
      cat: idCategoria
    });

    var urlFinal = SCRIPT_URL;

    if (idAnimacion) {
      urlFinal += "?id=" + encodeURIComponent(idAnimacion);
    }

    document.getElementById('mi-catalogo').src = urlFinal;
  </script>

</body>
</html>
